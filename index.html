<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mike's Professional Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:
        radial-gradient(circle at top right,
        rgba(0,255,255,0.12), transparent 30%),

        radial-gradient(circle at bottom left,
        rgba(0,128,255,0.15), transparent 40%),

        linear-gradient(135deg,#020617,#0f172a,#111827);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* Animated Tech Grid Background */
body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(0,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,.05) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-2;
}

body::after{
    content:'';
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle,
        rgba(100,255,218,0.08),
        transparent 70%);
    animation:pulse 6s ease-in-out infinite;
    z-index:-1;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

.myDiv{
    max-width:1300px;
    margin:30px auto;
    padding:35px;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(12px);

    border:1px solid rgba(100,255,218,.25);
    border-radius:25px;

    text-align:center;

    box-shadow:
        0 0 25px rgba(0,255,255,.10),
        0 0 50px rgba(0,128,255,.10);
}

h1,h2,h3{
    text-transform:uppercase;
    letter-spacing:2px;
}

h1{
    font-size:3rem;
    color:#64ffda;
    text-shadow:0 0 15px #64ffda;
    margin-bottom:25px;
}

h3{
    font-size:1.8rem;
    margin:20px 0;
    color:#38bdf8;
}

p{
    margin:15px 0;
}

a{
    color:#64ffda;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

a:hover{
    color:white;
    text-shadow:0 0 10px #64ffda;
}

.contact{
    font-size:1.1rem;
    margin-top:15px;
}

.banner{
    width:100%;
    max-width:1000px;
    border-radius:15px;
    box-shadow:0 0 25px rgba(100,255,218,.25);
}

.certifications{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-top:30px;
}

.certifications img{
    width:250px;
    height:125px;
    border-radius:12px;
    border:1px solid rgba(100,255,218,.2);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.certifications img:hover{
    transform:translateY(-6px) scale(1.05);

    box-shadow:
        0 0 20px rgba(100,255,218,.5),
        0 0 35px rgba(59,130,246,.35);
}

.footer-links{
    margin-top:25px;
}

</style>

</head>

<body>

<div class="myDiv">

    <h1>Welcome To My Page</h1>

    <h3><i>Professional Background</i></h3>

    <p>
        <img src="res2.png" style="max-width:1000px; width:100%; height:auto;"alt="Professional Background">
    </p>

    <div class="certifications">

        <img src="pycore.png" alt="Python Core">

        <img src="py_interm.png" alt="Python Intermediate">

        <img src="js core.jpg" alt="JavaScript Core">

        <img src="python finance.jpg" alt="Python Finance">

        <img src="Forcasting Analytics.jpg" alt="Forcasting Analytics">

        <img src="datascience.jpg" alt="Data Science">

        <img src="sqll.png" alt="SQL">

    </div>

    <div class="footer-links">

        <p>
            <a href="https://www.linkedin.com/in/michael-chaplin-7955b311/"
               target="_blank">
                🔗 Connect With Me On LinkedIn
            </a>
        </p>

        <p class="contact">
            📧 <strong>mchaplin1212@gmail.com</strong>
        </p>

        <p>
            <a href="mailto:mchaplin1212@gmail.com">
                Send Me An Email
            </a>
        </p>

    </div>

</div>

</body>
</html>
